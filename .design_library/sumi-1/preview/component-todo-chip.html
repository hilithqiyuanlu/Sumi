<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Chip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-sans); color: var(--color-on-surface); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .label { font-size: 10px; color: var(--color-muted-foreground); min-width: 80px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 4px 0 10px; }
  /* @component-css-start */
  .todo-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px; border-radius: var(--radius-pill); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 280px; font-size: var(--font-size-body); }
  .todo-chip--pending { background: var(--task-chip-bg); color: var(--color-on-surface); }
  .todo-chip--done { background: var(--task-chip-done-bg); color: var(--color-muted-foreground); }
  .todo-chip .text { overflow: hidden; text-overflow: ellipsis; }
  .check-circle { width: 18px; height: 18px; min-width: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .check-circle--filled { background: var(--color-primary-container); }
  .check-circle--empty { background: var(--color-outline-variant); }
  .check-circle svg { width: 10px; height: 10px; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">Pending</span>
    <span class="todo-chip todo-chip--pending"><span class="check-circle check-circle--empty"></span><span class="text">看深度学习入门</span></span>
    <span class="todo-chip todo-chip--pending"><span class="check-circle check-circle--empty"></span><span class="text">去B站看知识图谱导论课</span></span>
    <span class="todo-chip todo-chip--pending"><span class="check-circle check-circle--empty"></span><span class="text">线性代数与统计学入门</span></span>
    <span class="todo-chip todo-chip--pending"><span class="check-circle check-circle--empty"></span><span class="text">撰写微积分课程手册第6章内容</span></span>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">Completed</span>
    <span class="todo-chip todo-chip--done"><span class="check-circle check-circle--filled"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L5 9L9.5 3.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="text">准备读机器学习西瓜书</span></span>
    <span class="todo-chip todo-chip--done"><span class="check-circle check-circle--filled"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L5 9L9.5 3.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="text">开发Sumi的Skill与Mcp等插件</span></span>
  </div>
</body>
</html>
