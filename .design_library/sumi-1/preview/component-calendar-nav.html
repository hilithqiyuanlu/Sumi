<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Nav — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--neutral-100);
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .preview-container {
      max-width: 390px;
      margin: 0 auto;
      padding: 16px;
      background: var(--paper);
      min-height: 100vh;
    }

    .variant-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-6);
    }
    .variant-section + .variant-section {
      margin-top: var(--space-9);
    }

    /* Calendar nav wrapper — white bg + radiusCardHeader */
    .calendar-wrapper {
      background: var(--paper);
      border-radius: var(--radius-card-header);
      padding: var(--space-6);
      box-shadow: var(--shadow-1);
    }

    /* Calendar nav horizontal scroll */
    .calendar-nav {
      display: flex;
      gap: var(--space-4);
      overflow-x: auto;
      padding-bottom: var(--space-2);
    }

    /* Date chip — 52x72, radiusCard */
    .date-chip {
      flex-shrink: 0;
      width: 52px;
      height: 72px;
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: background var(--duration-fast) var(--easing-standard);
    }

    .date-chip .weekday {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-tertiary);
      line-height: 1;
    }

    .date-chip .day {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }

    .date-chip .task-dot-wrapper {
      width: 4px;
      height: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .date-chip .task-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--task-dot);
    }

    /* Today state — primary100@50% bg */
    .date-chip.today {
      background: rgba(217, 226, 252, 0.5);
    }

    /* Selected state — primary500 bg + white text */
    .date-chip.selected {
      background: var(--primary-500);
    }
    .date-chip.selected .weekday {
      color: rgba(255, 255, 255, 0.8);
    }
    .date-chip.selected .day {
      color: #ffffff;
    }
    .date-chip.selected .task-dot {
      background: rgba(255, 255, 255, 0.7);
    }

    /* Drag Handle — 36x4 */
    .drag-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--neutral-200);
      margin: var(--space-5) auto 0;
    }
  </style>
</head>
<body>
  <div class="preview-container">

    <!-- DEFAULT variant -->
    <div class="variant-section">
      <div class="variant-title">DEFAULT</div>
      <div class="calendar-wrapper">
        <div class="calendar-nav">
          <div class="date-chip">
            <span class="weekday">一</span>
            <span class="day">11</span>
            <span class="task-dot-wrapper"></span>
          </div>
          <div class="date-chip">
            <span class="weekday">二</span>
            <span class="day">12</span>
            <span class="task-dot-wrapper"></span>
          </div>
          <div class="date-chip today">
            <span class="weekday">三</span>
            <span class="day">13</span>
            <span class="task-dot-wrapper"></span>
          </div>
          <div class="date-chip selected">
            <span class="weekday">四</span>
            <span class="day">14</span>
            <span class="task-dot-wrapper"><span class="task-dot"></span></span>
          </div>
          <div class="date-chip">
            <span class="weekday">五</span>
            <span class="day">15</span>
            <span class="task-dot-wrapper"></span>
          </div>
          <div class="date-chip">
            <span class="weekday">六</span>
            <span class="day">16</span>
            <span class="task-dot-wrapper"></span>
          </div>
          <div class="date-chip">
            <span class="weekday">日</span>
            <span class="day">17</span>
            <span class="task-dot-wrapper"></span>
          </div>
        </div>
        <div class="drag-handle"></div>
      </div>
    </div>

    <!-- WITH TASK DOTS variant -->
    <div class="variant-section">
      <div class="variant-title">WITH TASK DOTS</div>
      <div class="calendar-wrapper">
        <div class="calendar-nav">
          <div class="date-chip">
            <span class="weekday">一</span>
            <span class="day">11</span>
            <span class="task-dot-wrapper"><span class="task-dot"></span></span>
          </div>
          <div class="date-chip">
            <span class="weekday">二</span>
            <span class="day">12</span>
            <span class="task-dot-wrapper"></span>
          </div>
          <div class="date-chip today">
            <span class="weekday">三</span>
            <span class="day">13</span>
            <span class="task-dot-wrapper"><span class="task-dot"></span></span>
          </div>
          <div class="date-chip selected">
            <span class="weekday">四</span>
            <span class="day">14</span>
            <span class="task-dot-wrapper"><span class="task-dot"></span></span>
          </div>
          <div class="date-chip">
            <span class="weekday">五</span>
            <span class="day">15</span>
            <span class="task-dot-wrapper"><span class="task-dot"></span></span>
          </div>
          <div class="date-chip">
            <span class="weekday">六</span>
            <span class="day">16</span>
            <span class="task-dot-wrapper"></span>
          </div>
          <div class="date-chip">
            <span class="weekday">日</span>
            <span class="day">17</span>
            <span class="task-dot-wrapper"><span class="task-dot"></span></span>
          </div>
        </div>
        <div class="drag-handle"></div>
      </div>
    </div>

  </div>
</body>
</html>
