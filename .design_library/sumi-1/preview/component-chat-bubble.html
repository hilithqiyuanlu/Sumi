<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Bubble — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--neutral-100);
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .preview-container {
      max-width: 390px;
      margin: 0 auto;
      padding: 16px;
      background: var(--paper);
      min-height: 100vh;
    }

    .variant-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-6);
    }
    .variant-section + .variant-section {
      margin-top: var(--space-9);
    }

    /* Chat flow */
    .chat-flow {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* Message row */
    .message-row {
      display: flex;
      flex-direction: column;
    }
    .message-row.user {
      align-items: flex-end;
    }
    .message-row.ai {
      align-items: flex-start;
    }

    /* Timestamp — centered above user bubble */
    .timestamp {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-tertiary);
      text-align: center;
      margin-bottom: var(--space-4);
    }

    /* Bubble — shared */
    .bubble {
      max-width: 72%;
      padding: 12px 10px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    /* User bubble */
    .message-row.user .bubble {
      background: var(--mint);
      color: var(--ink);
      border-radius: 20px 4px 20px 20px;
    }

    /* AI bubble */
    .message-row.ai .bubble {
      background: var(--paper);
      color: var(--ink);
      border: 0.5px var(--chat-ai-border);
      box-shadow: var(--shadow-2);
      border-radius: 4px 20px 20px 20px;
    }
  </style>
</head>
<body>
  <div class="preview-container">

    <!-- Chat conversation -->
    <div class="chat-flow">

      <!-- User message with timestamp -->
      <div class="message-row user">
        <div class="timestamp">7/15 14:30</div>
        <div class="bubble">建议以什么顺序开展我今天的待办</div>
      </div>

      <!-- AI message -->
      <div class="message-row ai">
        <div class="bubble">根据你今天的待办列表，建议按以下顺序：先看深度学习入门打基础，然后是线性代数与统计，下午去B站看知识图谱导论课，最后撰写微积分课程手册第6章。</div>
      </div>

      <!-- User message with timestamp -->
      <div class="message-row user">
        <div class="timestamp">7/15 14:31</div>
        <div class="bubble">推荐些深度学习的配套资源</div>
      </div>

    </div>

  </div>
</body>
</html>
