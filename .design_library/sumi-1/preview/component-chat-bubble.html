<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Bubble — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--neutral-100);
      font-family: var(--font-body);
      color: var(--on-surface);
      -webkit-font-smoothing: antialiased;
    }
    .preview-container {
      max-width: 390px;
      margin: 0 auto;
      padding: 16px;
      background: var(--surface);
      min-height: 100vh;
    }

    .variant-title {
      font-size: var(--font-size-body-sm);
      font-weight: 600;
      color: var(--on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-6);
    }
    .variant-section + .variant-section {
      margin-top: var(--space-9);
    }

    /* Chat flow */
    .chat-flow {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* Message row */
    .message-row {
      display: flex;
      flex-direction: column;
    }
    .message-row.user {
      align-items: flex-end;
    }
    .message-row.ai {
      align-items: flex-start;
    }

    /* Role label */
    .role-label {
      font-size: var(--font-size-body-sm);
      font-weight: 400;
      color: var(--neutral-500);
      margin-bottom: var(--space-3);
      padding: 0 var(--space-5);
    }

    /* Timestamp */
    .timestamp {
      font-size: var(--font-size-body-xs);
      font-weight: 400;
      color: var(--neutral-500);
      text-align: center;
      margin-bottom: var(--space-6);
    }

    /* Bubble */
    .bubble {
      max-width: 78%;
      padding: var(--space-5) var(--space-7);
      font-size: var(--font-size-body-base);
      line-height: 1.5;
      word-break: break-word;
    }

    /* User bubble */
    .message-row.user .bubble {
      background: var(--primary-100);
      color: var(--on-surface);
      border-radius: 20px 4px 20px 20px;
    }

    /* AI bubble */
    .message-row.ai .bubble {
      background: var(--surface);
      color: var(--on-surface);
      border: 1px solid var(--outline-variant);
      border-radius: 4px 20px 20px 20px;
    }
  </style>
</head>
<body>
  <div class="preview-container">

    <!-- Chat conversation -->
    <div class="chat-flow">

      <!-- Timestamp -->
      <div class="timestamp">今天 14:32</div>

      <!-- User message -->
      <div class="message-row user">
        <span class="role-label">你</span>
        <div class="bubble">建议以什么顺序开展我今天的待办</div>
      </div>

      <!-- AI message -->
      <div class="message-row ai">
        <span class="role-label">Sumi</span>
        <div class="bubble">根据你今天的待办列表，建议按以下顺序：先看深度学习入门打基础，然后是线性代数与统计，下午去B站看知识图谱导论课，最后撰写微积分课程手册第6章。</div>
      </div>

      <!-- User message -->
      <div class="message-row user">
        <span class="role-label">你</span>
        <div class="bubble">推荐些深度学习的配套资源</div>
      </div>

    </div>

  </div>
</body>
</html>
