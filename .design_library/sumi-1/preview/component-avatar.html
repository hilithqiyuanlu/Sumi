<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: 16px; background: var(--surface); min-height: 100vh; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-full); background: var(--surface-container-high); color: var(--on-surface); font-weight: 500; flex-shrink: 0; position: relative; user-select: none; }
    .avatar-size-24 { width: 24px; height: 24px; font-size: 10px; }
    .avatar-size-32 { width: 32px; height: 32px; font-size: 12px; }
    .avatar-size-40 { width: 40px; height: 40px; font-size: 14px; }
    .avatar-size-48 { width: 48px; height: 48px; font-size: 16px; }
    .avatar-size-64 { width: 64px; height: 64px; font-size: 22px; }
    .status-dot { position: absolute; width: 10px; height: 10px; border-radius: var(--radius-full); border: 2px solid var(--surface); bottom: 0; right: 0; }
    .status-online { background: var(--success-default); }
    .status-offline { background: var(--neutral-400); }
    .status-busy { background: var(--error-default); }
    .label { font-size: var(--font-size-body-sm); color: var(--on-surface-variant); }
  </style>
</head>
<body><div class="preview-container">

  <!-- Section: Sizes -->
  <div class="section">
    <div class="section-title">Sizes</div>
    <div class="row" style="gap: 16px; align-items: end;">
      <div style="text-align:center;">
        <div class="avatar avatar-size-24">E</div>
        <div class="label" style="margin-top:4px;">24</div>
      </div>
      <div style="text-align:center;">
        <div class="avatar avatar-size-32">E</div>
        <div class="label" style="margin-top:4px;">32</div>
      </div>
      <div style="text-align:center;">
        <div class="avatar avatar-size-40">E</div>
        <div class="label" style="margin-top:4px;">40</div>
      </div>
      <div style="text-align:center;">
        <div class="avatar avatar-size-48">E</div>
        <div class="label" style="margin-top:4px;">48</div>
      </div>
      <div style="text-align:center;">
        <div class="avatar avatar-size-64">E</div>
        <div class="label" style="margin-top:4px;">64</div>
      </div>
    </div>
  </div>

  <!-- Section: With Status -->
  <div class="section">
    <div class="section-title">With Status</div>
    <div class="row" style="gap: 24px;">
      <div style="text-align:center;">
        <div class="avatar avatar-size-40">E
          <span class="status-dot status-online"></span>
        </div>
        <div class="label" style="margin-top:6px;">Online</div>
      </div>
      <div style="text-align:center;">
        <div class="avatar avatar-size-40">E
          <span class="status-dot status-offline"></span>
        </div>
        <div class="label" style="margin-top:6px;">Offline</div>
      </div>
      <div style="text-align:center;">
        <div class="avatar avatar-size-40">E
          <span class="status-dot status-busy"></span>
        </div>
        <div class="label" style="margin-top:6px;">Busy</div>
      </div>
    </div>
  </div>

  <!-- Section: Status on larger size -->
  <div class="section">
    <div class="section-title">Status on 48px</div>
    <div class="row" style="gap: 24px;">
      <div style="text-align:center;">
        <div class="avatar avatar-size-48">E
          <span class="status-dot status-online"></span>
        </div>
        <div class="label" style="margin-top:6px;">Online</div>
      </div>
      <div style="text-align:center;">
        <div class="avatar avatar-size-48">E
          <span class="status-dot status-busy"></span>
        </div>
        <div class="label" style="margin-top:6px;">Busy</div>
      </div>
    </div>
  </div>

</div></body>
</html>
