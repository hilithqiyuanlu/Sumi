<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: var(--space-7); background: var(--surface); min-height: 100vh; }
    .section-label { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-4); }
    .section { margin-bottom: var(--space-9); }
    .row { display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; }

    /* @component-css-start */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: var(--font-size-body-base);
      font-weight: 500;
      line-height: var(--line-height-body-base);
      border-radius: var(--radius-full);
      height: 40px;
      padding: 0 var(--space-7);
      transition: filter var(--duration-fast) var(--easing-standard);
      user-select: none;
      -webkit-user-select: none;
    }

    .btn:active {
      filter: brightness(0.92);
    }

    /* Primary */
    .btn--primary {
      background: var(--primary-600);
      color: var(--on-primary);
    }

    /* Secondary */
    .btn--secondary {
      background: var(--surface-container);
      color: var(--on-surface);
      border: 1px solid var(--outline-variant);
    }

    /* Ghost */
    .btn--ghost {
      background: transparent;
      color: var(--primary-600);
      padding: 0 var(--space-5);
    }

    .btn--ghost:active {
      background: var(--interactive-press);
    }

    /* Icon button */
    .btn--icon {
      width: 40px;
      height: 40px;
      padding: 0;
      background: var(--surface-container);
      color: var(--on-surface);
      border-radius: var(--radius-full);
    }

    .btn--icon svg {
      width: var(--size-icon-md);
      height: var(--size-icon-md);
    }

    /* Danger */
    .btn--danger {
      background: var(--error-default);
      color: #ffffff;
    }

    /* Disabled */
    .btn--disabled {
      opacity: 0.4;
      pointer-events: none;
      cursor: default;
    }

    /* Small size variant */
    .btn--sm {
      height: 32px;
      padding: 0 var(--space-6);
      font-size: var(--font-size-body-md);
    }

    /* Large size variant */
    .btn--lg {
      height: 48px;
      padding: 0 var(--space-9);
    }

    /* @component-css-end */
  </style>
</head>
<body>
<div class="preview-container">

  <!-- PRIMARY -->
  <div class="section">
    <div class="section-label">Primary</div>
    <div class="row">
      <button class="btn btn--primary">保存</button>
      <button class="btn btn--primary">发送</button>
      <button class="btn btn--primary">确定</button>
    </div>
  </div>

  <!-- SECONDARY -->
  <div class="section">
    <div class="section-label">Secondary</div>
    <div class="row">
      <button class="btn btn--secondary">取消</button>
      <button class="btn btn--secondary">稍后</button>
      <button class="btn btn--secondary">关闭</button>
    </div>
  </div>

  <!-- GHOST -->
  <div class="section">
    <div class="section-label">Ghost</div>
    <div class="row">
      <button class="btn btn--ghost">了解更多</button>
      <button class="btn btn--ghost">查看详情</button>
      <button class="btn btn--ghost">跳过</button>
    </div>
  </div>

  <!-- ICON -->
  <div class="section">
    <div class="section-label">Icon</div>
    <div class="row">
      <button class="btn btn--icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button class="btn btn--icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="btn btn--icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>

  <!-- DANGER -->
  <div class="section">
    <div class="section-label">Danger</div>
    <div class="row">
      <button class="btn btn--danger">删除</button>
      <button class="btn btn--danger">移除</button>
    </div>
  </div>

  <!-- DISABLED -->
  <div class="section">
    <div class="section-label">Disabled</div>
    <div class="row">
      <button class="btn btn--primary btn--disabled">保存</button>
      <button class="btn btn--secondary btn--disabled">取消</button>
      <button class="btn btn--ghost btn--disabled">了解更多</button>
      <button class="btn btn--icon btn--disabled">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
    </div>
  </div>

</div>
</body>
</html>
