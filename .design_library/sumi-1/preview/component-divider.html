<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divider — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: 16px; background: var(--surface); min-height: 100vh; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .demo-block { background: var(--surface-container); border-radius: var(--radius-8); padding: 16px; }
    .demo-text { font-size: var(--font-size-body-base); color: var(--on-surface); margin-bottom: 8px; }
    .divider { border: none; margin: 0; }
    .divider-default { border-top: 1px solid var(--outline-variant); }
    .divider-inset { border-top: 1px solid var(--outline-variant); margin-left: 16px; margin-right: 16px; }
    .demo-text-after { font-size: var(--font-size-body-base); color: var(--on-surface); margin-top: 8px; }
  </style>
</head>
<body><div class="preview-container">

  <!-- Default Divider -->
  <div class="section">
    <div class="section-title">Default (Full Width)</div>
    <div class="demo-block">
      <div class="demo-text">上方内容</div>
      <hr class="divider divider-default">
      <div class="demo-text-after">下方内容</div>
    </div>
  </div>

  <!-- Inset Divider -->
  <div class="section">
    <div class="section-title">Inset (16px Indent)</div>
    <div class="demo-block">
      <div class="demo-text">上方内容</div>
      <hr class="divider divider-inset">
      <div class="demo-text-after">下方内容</div>
    </div>
  </div>

  <!-- Multiple Dividers -->
  <div class="section">
    <div class="section-title">In List Context</div>
    <div class="demo-block" style="padding: 0;">
      <div style="padding: 12px 16px; font-size: var(--font-size-body-base); color: var(--on-surface);">消息通知</div>
      <hr class="divider divider-default">
      <div style="padding: 12px 16px; font-size: var(--font-size-body-base); color: var(--on-surface);">学习提醒</div>
      <hr class="divider divider-default">
      <div style="padding: 12px 16px; font-size: var(--font-size-body-base); color: var(--on-surface);">系统更新</div>
      <hr class="divider divider-default">
      <div style="padding: 12px 16px; font-size: var(--font-size-body-base); color: var(--on-surface);">帮助与反馈</div>
    </div>
  </div>

  <!-- Inset in List Context -->
  <div class="section">
    <div class="section-title">Inset In List Context</div>
    <div class="demo-block" style="padding: 0;">
      <div style="padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--surface-container-high); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; flex-shrink: 0;">A</div>
        <div>
          <div style="font-size: var(--font-size-body-base); font-weight: 500; color: var(--on-surface);">Alice</div>
          <div style="font-size: var(--font-size-body-sm); color: var(--on-surface-variant);">已完成今日学习任务</div>
        </div>
      </div>
      <hr class="divider divider-inset">
      <div style="padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--surface-container-high); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; flex-shrink: 0;">B</div>
        <div>
          <div style="font-size: var(--font-size-body-base); font-weight: 500; color: var(--on-surface);">Bob</div>
          <div style="font-size: var(--font-size-body-sm); color: var(--on-surface-variant);">分享了新的学习笔记</div>
        </div>
      </div>
      <hr class="divider divider-inset">
      <div style="padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--surface-container-high); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; flex-shrink: 0;">C</div>
        <div>
          <div style="font-size: var(--font-size-body-base); font-weight: 500; color: var(--on-surface);">Charlie</div>
          <div style="font-size: var(--font-size-body-sm); color: var(--on-surface-variant);">加入学习小组</div>
        </div>
      </div>
    </div>
  </div>

</div></body>
</html>
