<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggestion Chip — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--neutral-100);
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .preview-container {
      max-width: 390px;
      margin: 0 auto;
      padding: 16px;
      background: var(--paper);
      min-height: 100vh;
    }

    .variant-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-6);
    }
    .variant-section + .variant-section {
      margin-top: var(--space-9);
    }

    /* Horizontal scroll container */
    .suggestion-scroll {
      display: flex;
      gap: var(--space-3);
      overflow-x: auto;
      padding-bottom: var(--space-2);
    }

    /* Suggestion chip — pill shape */
    .suggestion-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 8px 16px;
      background: var(--surface-chip);
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      transition: background var(--duration-fast) var(--easing-standard);
    }
    .suggestion-chip:hover {
      background: var(--neutral-200);
    }

    .suggestion-chip .chip-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .suggestion-chip .chip-icon svg {
      width: 16px;
      height: 16px;
      color: var(--primary-600);
    }

    .suggestion-chip .chip-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--primary-600);
      line-height: 1.3;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="preview-container">

    <!-- SUGGESTIONS variant — horizontal scroll -->
    <div class="variant-section">
      <div class="variant-title">SUGGESTIONS</div>
      <div class="suggestion-scroll">
        <button class="suggestion-chip" type="button">
          <span class="chip-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </span>
          <span class="chip-text">建议以什么顺序开展我今天的待办</span>
        </button>
        <button class="suggestion-chip" type="button">
          <span class="chip-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </span>
          <span class="chip-text">推荐些深度学习的配套资源</span>
        </button>
        <button class="suggestion-chip" type="button">
          <span class="chip-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </span>
          <span class="chip-text">帮我制定本周的学习计划</span>
        </button>
        <button class="suggestion-chip" type="button">
          <span class="chip-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </span>
          <span class="chip-text">总结今天的学习进度</span>
        </button>
      </div>
    </div>

  </div>
</body>
</html>
