<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestion Chip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-sans); color: var(--color-on-surface); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .label { font-size: 10px; color: var(--color-muted-foreground); min-width: 80px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 4px 0 10px; }
  /* @component-css-start */
  .chip { display: inline-flex; align-items: center; padding: var(--space-2) var(--space-3); background: var(--suggestion-bg); color: var(--suggestion-text); font-size: var(--font-size-body); font-family: var(--font-sans); border: none; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; transition: background .15s; }
  .chip:hover { background: var(--primary-100); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">Suggestions</span>
    <button class="chip">建议以什么顺序开展我今天的待办</button>
    <button class="chip">推荐些深度学习的配套资源</button>
    <button class="chip">帮我制定本周的学习计划</button>
  </div>
</body>
</html>
