<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Chip — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: var(--space-7); background: var(--surface); min-height: 100vh; }
    .section-label { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-4); }
    .section { margin-bottom: var(--space-9); }
    .chip-list { display: flex; gap: var(--space-4); flex-wrap: wrap; }

    /* @component-css-start */
    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background: var(--surface-chip);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--font-size-body-sm);
      font-weight: 400;
      line-height: var(--line-height-body-sm);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background var(--duration-fast) var(--easing-standard),
                  border-color var(--duration-fast) var(--easing-standard);
      white-space: nowrap;
    }

    .action-chip:active {
      filter: brightness(0.95);
    }

    .action-chip__icon {
      width: var(--size-icon-sm);
      height: var(--size-icon-sm);
      min-width: var(--size-icon-sm);
      color: var(--on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-chip__icon svg {
      width: var(--size-icon-sm);
      height: var(--size-icon-sm);
    }

    /* Active state */
    .action-chip--active {
      background: rgba(75, 63, 227, 0.12);
      border-color: rgba(75, 63, 227, 0.4);
      color: var(--primary-600);
    }

    .action-chip--active .action-chip__icon {
      color: var(--primary-600);
    }

    /* @component-css-end */
  </style>
</head>
<body>
<div class="preview-container">

  <!-- DEFAULT -->
  <div class="section">
    <div class="section-label">Default</div>
    <div class="chip-list">
      <span class="action-chip">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>
        </span>
        润色
      </span>
      <span class="action-chip">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        项目
      </span>
      <span class="action-chip">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </span>
        定时
      </span>
      <span class="action-chip">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
        复制
      </span>
    </div>
  </div>

  <!-- ACTIVE -->
  <div class="section">
    <div class="section-label">Active</div>
    <div class="chip-list">
      <span class="action-chip action-chip--active">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>
        </span>
        润色
      </span>
      <span class="action-chip">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        项目
      </span>
      <span class="action-chip action-chip--active">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </span>
        定时
      </span>
      <span class="action-chip">
        <span class="action-chip__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </span>
        复制
      </span>
    </div>
  </div>

</div>
</body>
</html>
