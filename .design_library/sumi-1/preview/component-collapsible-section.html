<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collapsible Section — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: 16px; background: var(--surface); min-height: 100vh; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .collapsible { border-radius: var(--radius-8); overflow: hidden; }
    .collapsible-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; user-select: none; }
    .collapsible-header-text { font-size: var(--font-size-body-md-strong); color: var(--on-surface-variant); display: flex; align-items: center; gap: 6px; }
    .collapsible-header-text svg { width: 16px; height: 16px; color: var(--on-surface-variant); }
    .collapsible-chevron { width: 20px; height: 20px; color: var(--neutral-400); transition: transform 200ms ease; }
    .collapsible-chevron.rotated { transform: rotate(90deg); }
    .collapsible-body { padding: 0 16px 12px 16px; font-size: var(--font-size-body-base); color: var(--on-surface); line-height: 1.6; }
    .collapsible-body p { margin: 0 0 8px 0; }
    .collapsible-body p:last-child { margin-bottom: 0; }
    /* Variants */
    .variant-default { background: var(--surface-container); }
    .variant-bordered { background: var(--surface-container); border: 1px solid var(--outline-variant); }
  </style>
</head>
<body><div class="preview-container">

  <!-- Default (Collapsed) -->
  <div class="section">
    <div class="section-title">Default (Collapsed)</div>
    <div class="collapsible variant-default">
      <div class="collapsible-header">
        <span class="collapsible-header-text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          思考过程
        </span>
        <svg class="collapsible-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
  </div>

  <!-- Expanded -->
  <div class="section">
    <div class="section-title">Expanded</div>
    <div class="collapsible variant-default">
      <div class="collapsible-header">
        <span class="collapsible-header-text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          思考过程
        </span>
        <svg class="collapsible-chevron rotated" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="collapsible-body">
        <p>用户正在询问关于线性代数的学习建议，需要从基础概念出发，给出循序渐进的学习路径。</p>
        <p>推荐先掌握矩阵运算和行列式，再进入特征值与向量空间的学习。</p>
      </div>
    </div>
  </div>

  <!-- Bordered (Collapsed) -->
  <div class="section">
    <div class="section-title">Bordered (Collapsed)</div>
    <div class="collapsible variant-bordered">
      <div class="collapsible-header">
        <span class="collapsible-header-text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          参考资料
        </span>
        <svg class="collapsible-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
  </div>

  <!-- Bordered (Expanded) -->
  <div class="section">
    <div class="section-title">Bordered (Expanded)</div>
    <div class="collapsible variant-bordered">
      <div class="collapsible-header">
        <span class="collapsible-header-text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          参考资料
        </span>
        <svg class="collapsible-chevron rotated" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="collapsible-body">
        <p>1. 《线性代数应该这样学》— Sheldon Axler</p>
        <p>2. MIT 18.06 线性代数公开课 — Gilbert Strang</p>
        <p>3. 3Blue1Brown 线性代数的本质系列视频</p>
      </div>
    </div>
  </div>

</div></body>
</html>
