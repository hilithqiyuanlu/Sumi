<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Hint Bar — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: 16px; background: var(--surface); min-height: 100vh; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .voice-bar { display: flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: var(--radius-full); }
    .voice-bar-listening { background: rgba(229,234,255,0.15); }
    .voice-bar-cancel { background: var(--surface-container); }
    .voice-bar-listening .voice-text { color: var(--primary-600); }
    .voice-bar-cancel .voice-text { color: var(--neutral-500); }
    .voice-text { font-size: var(--font-size-body-base); font-weight: 500; }
    .voice-icon { width: 18px; height: 18px; margin-right: 8px; }
    .voice-bar-listening .voice-icon { color: var(--primary-600); }
    .voice-bar-cancel .voice-icon { color: var(--neutral-500); }
    .demo-frame { background: var(--surface-container); border-radius: var(--radius-8); padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .mic-btn { width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--primary-600); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(75,63,227,0.3); }
    .mic-btn svg { width: 28px; height: 28px; color: #fff; }
    .label { font-size: var(--font-size-body-sm); color: var(--on-surface-variant); text-align: center; }
  </style>
</head>
<body><div class="preview-container">

  <!-- Listening State -->
  <div class="section">
    <div class="section-title">Listening</div>
    <div class="demo-frame">
      <div class="voice-bar voice-bar-listening">
        <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <span class="voice-text">正在收听...松开发送</span>
      </div>
      <span class="label">primary-100 @ 15% / primary-600 text</span>
    </div>
  </div>

  <!-- Cancel State -->
  <div class="section">
    <div class="section-title">Cancel (Slide to Cancel)</div>
    <div class="demo-frame">
      <div class="voice-bar voice-bar-cancel">
        <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <span class="voice-text">松开取消</span>
      </div>
      <span class="label">surface-container bg / neutral-500 text</span>
    </div>
  </div>

  <!-- In Context -->
  <div class="section">
    <div class="section-title">In Context</div>
    <div style="background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-8); overflow: hidden;">
      <div style="padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 200px; justify-content: center;">
        <div style="font-size: var(--font-size-body-sm); color: var(--on-surface-variant);">按住麦克风开始说话</div>
        <div class="mic-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
      </div>
      <div style="padding: 0 16px 16px 16px;">
        <div class="voice-bar voice-bar-listening" style="width: 100%;">
          <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <span class="voice-text">正在收听...松开发送</span>
        </div>
      </div>
    </div>
  </div>

</div></body>
</html>
