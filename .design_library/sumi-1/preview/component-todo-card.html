<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Card — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: var(--space-7); background: var(--surface); min-height: 100vh; }
    .section-label { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-4); }
    .section { margin-bottom: var(--space-9); }
    .card-list { display: flex; flex-direction: column; gap: var(--space-4); }

    /* @component-css-start */
    .todo-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-1);
      padding: var(--space-6);
      position: relative;
    }

    .todo-card__header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
    }

    .todo-card__check {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      cursor: pointer;
    }

    .todo-card__check--pending {
      color: var(--outline);
    }

    .todo-card__check--done {
      color: var(--success-default);
    }

    .todo-card__check svg {
      width: 18px;
      height: 18px;
    }

    .todo-card__content {
      flex: 1;
      min-width: 0;
    }

    .todo-card__title {
      font-size: var(--font-size-body-base);
      font-weight: 400;
      line-height: var(--line-height-body-base);
      color: var(--on-surface);
    }

    .todo-card__meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .todo-card__project-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      min-width: 6px;
    }

    .todo-card__project-dot--teal { background: var(--accent-teal-500); }
    .todo-card__project-dot--coral { background: var(--accent-coral-500); }
    .todo-card__project-dot--violet { background: var(--accent-violet-500); }

    .todo-card__project-name {
      font-size: var(--font-size-body-sm);
      color: var(--on-surface-variant);
      line-height: var(--line-height-body-sm);
    }

    .todo-card__pin {
      width: var(--size-icon-sm);
      height: var(--size-icon-sm);
      min-width: var(--size-icon-sm);
      color: var(--neutral-400);
      cursor: pointer;
      margin-top: 1px;
    }

    .todo-card__pin svg {
      width: var(--size-icon-sm);
      height: var(--size-icon-sm);
    }

    .todo-card__reminder {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .todo-card__reminder-icon {
      width: 14px;
      height: 14px;
      min-width: 14px;
      color: var(--on-surface-variant);
    }

    .todo-card__reminder-icon svg {
      width: 14px;
      height: 14px;
    }

    .todo-card__reminder-text {
      font-size: var(--font-size-body-sm);
      color: var(--on-surface-variant);
      line-height: var(--line-height-body-sm);
    }

    /* Done state */
    .todo-card--done {
      opacity: 0.6;
    }

    .todo-card--done .todo-card__title {
      text-decoration: line-through;
      color: var(--on-surface-variant);
    }

    .todo-card--done .todo-card__meta {
      opacity: 0.7;
    }

    /* Project colored variant */
    .todo-card--project-colored {
      box-shadow: none;
    }

    .todo-card--project-colored--teal { background: rgba(77, 152, 130, 0.25); }
    .todo-card--project-colored--coral { background: rgba(184, 137, 126, 0.25); }
    .todo-card--project-colored--violet { background: rgba(136, 122, 204, 0.25); }

    .todo-card--project-colored .todo-card__title {
      color: var(--on-surface);
    }

    /* @component-css-end */
  </style>
</head>
<body>
<div class="preview-container">

  <!-- PENDING variant -->
  <div class="section">
    <div class="section-label">Pending</div>
    <div class="card-list">
      <div class="todo-card">
        <div class="todo-card__header">
          <span class="todo-card__check todo-card__check--pending">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          </span>
          <div class="todo-card__content">
            <div class="todo-card__title">撰写微积分课程手册第6章内容</div>
            <div class="todo-card__meta">
              <span class="todo-card__project-dot todo-card__project-dot--teal"></span>
              <span class="todo-card__project-name">数学</span>
            </div>
          </div>
          <span class="todo-card__pin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V5a3 3 0 0 0-6 0z"/></svg>
          </span>
        </div>
      </div>

      <div class="todo-card">
        <div class="todo-card__header">
          <span class="todo-card__check todo-card__check--pending">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          </span>
          <div class="todo-card__content">
            <div class="todo-card__title">看深度学习入门</div>
            <div class="todo-card__meta">
              <span class="todo-card__project-dot todo-card__project-dot--coral"></span>
              <span class="todo-card__project-name">编程</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- DONE variant -->
  <div class="section">
    <div class="section-label">Done</div>
    <div class="card-list">
      <div class="todo-card todo-card--done">
        <div class="todo-card__header">
          <span class="todo-card__check todo-card__check--done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
          </span>
          <div class="todo-card__content">
            <div class="todo-card__title">准备读机器学习西瓜书</div>
            <div class="todo-card__meta">
              <span class="todo-card__project-dot todo-card__project-dot--violet"></span>
              <span class="todo-card__project-name">机器学习</span>
            </div>
          </div>
        </div>
      </div>

      <div class="todo-card todo-card--done">
        <div class="todo-card__header">
          <span class="todo-card__check todo-card__check--done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
          </span>
          <div class="todo-card__content">
            <div class="todo-card__title">开发 Sumi 的 Skill 与 Mcp 等插件</div>
          </div>
          <span class="todo-card__pin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V5a3 3 0 0 0-6 0z"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- PROJECT COLORED variant -->
  <div class="section">
    <div class="section-label">Project Colored</div>
    <div class="card-list">
      <div class="todo-card todo-card--project-colored todo-card--project-colored--teal">
        <div class="todo-card__header">
          <span class="todo-card__check todo-card__check--pending">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          </span>
          <div class="todo-card__content">
            <div class="todo-card__title">线性代数与统计学入门</div>
            <div class="todo-card__meta">
              <span class="todo-card__project-dot todo-card__project-dot--teal"></span>
              <span class="todo-card__project-name">数学</span>
            </div>
          </div>
        </div>
      </div>

      <div class="todo-card todo-card--project-colored todo-card--project-colored--coral">
        <div class="todo-card__header">
          <span class="todo-card__check todo-card__check--pending">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          </span>
          <div class="todo-card__content">
            <div class="todo-card__title">去B站看知识图谱导论课</div>
            <div class="todo-card__meta">
              <span class="todo-card__project-dot todo-card__project-dot--coral"></span>
              <span class="todo-card__project-name">编程</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- WITH REMINDER variant -->
  <div class="section">
    <div class="section-label">With Reminder</div>
    <div class="card-list">
      <div class="todo-card">
        <div class="todo-card__header">
          <span class="todo-card__check todo-card__check--pending">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          </span>
          <div class="todo-card__content">
            <div class="todo-card__title">撰写微积分课程手册第6章内容</div>
            <div class="todo-card__meta">
              <span class="todo-card__project-dot todo-card__project-dot--teal"></span>
              <span class="todo-card__project-name">数学</span>
            </div>
            <div class="todo-card__reminder">
              <span class="todo-card__reminder-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              </span>
              <span class="todo-card__reminder-text">今天 14:00</span>
            </div>
          </div>
          <span class="todo-card__pin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V5a3 3 0 0 0-6 0z"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
