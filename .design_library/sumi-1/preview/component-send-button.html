<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Button — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: var(--space-7); background: var(--surface); min-height: 100vh; }
    .section-label { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-4); }
    .section { margin-bottom: var(--space-9); }
    .demo-row { display: flex; align-items: center; gap: var(--space-5); }
    .demo-input {
      flex: 1;
      height: 40px;
      background: var(--surface-chip);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-12);
      padding: 0 var(--space-5);
      font-family: var(--font-body);
      font-size: var(--font-size-body-base);
      color: var(--on-surface);
      outline: none;
      box-sizing: border-box;
    }
    .demo-input::placeholder { color: var(--on-surface-variant); }
    .demo-input--empty::placeholder { color: var(--on-surface-variant); }

    /* @component-css-start */
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: var(--primary-600);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: opacity var(--duration-fast) var(--easing-standard),
                  transform var(--duration-fast) var(--easing-standard);
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    .send-btn svg {
      width: var(--size-icon-md);
      height: var(--size-icon-md);
      color: #ffffff;
    }

    /* Hidden state */
    .send-btn--hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* @component-css-end */
  </style>
</head>
<body>
<div class="preview-container">

  <!-- DEFAULT (visible) -->
  <div class="section">
    <div class="section-label">Default (Visible)</div>
    <div class="demo-row">
      <input class="demo-input" type="text" placeholder="输入内容..." value="帮我写一段自我介绍">
      <button class="send-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><path d="M22 2l-7 20-4-9-9-4Z"/></svg>
      </button>
    </div>
  </div>

  <!-- HIDDEN -->
  <div class="section">
    <div class="section-label">Hidden (Empty Input)</div>
    <div class="demo-row">
      <input class="demo-input demo-input--empty" type="text" placeholder="输入内容..." value="">
      <button class="send-btn send-btn--hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><path d="M22 2l-7 20-4-9-9-4Z"/></svg>
      </button>
    </div>
  </div>

  <!-- DEFAULT (standalone) -->
  <div class="section">
    <div class="section-label">Standalone</div>
    <div style="display: flex; gap: var(--space-7); align-items: center;">
      <div style="text-align: center;">
        <button class="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><path d="M22 2l-7 20-4-9-9-4Z"/></svg>
        </button>
        <div style="font-size: var(--font-size-body-xs); color: var(--on-surface-variant); margin-top: var(--space-3);">Visible</div>
      </div>
      <div style="text-align: center;">
        <button class="send-btn send-btn--hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><path d="M22 2l-7 20-4-9-9-4Z"/></svg>
        </button>
        <div style="font-size: var(--font-size-body-xs); color: var(--on-surface-variant); margin-top: var(--space-3);">Hidden</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
