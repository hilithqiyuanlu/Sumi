<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottom Sheet — Sumi Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: 0; background: var(--neutral-100); font-family: var(--font-body); color: var(--on-surface); -webkit-font-smoothing: antialiased; }
    .preview-container { max-width: 390px; margin: 0 auto; padding: 16px; background: var(--surface); min-height: 100vh; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: var(--font-size-body-xs); font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .sheet-demo { position: relative; border-radius: var(--radius-8); overflow: hidden; }
    .scrim { background: rgba(0,0,0,0.4); border-radius: var(--radius-8); padding: 40px 0 0 0; display: flex; flex-direction: column; align-items: center; }
    .bottom-sheet { background: var(--surface); border-radius: var(--radius-card-header) var(--radius-card-header) 0 0; width: 100%; padding: 0 20px 24px 20px; box-shadow: var(--shadow-5); }
    .drag-handle-area { display: flex; justify-content: center; padding: 10px 0 8px 0; }
    .drag-handle { width: 36px; height: 4px; border-radius: var(--radius-2); background: rgba(161,161,161,0.3); }
    .sheet-title { font-size: 15px; font-weight: 600; color: var(--on-surface); margin-bottom: 12px; }
    .sheet-body { font-size: var(--font-size-body-base); color: var(--on-surface-variant); line-height: 1.6; }
    .sheet-option { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--outline-variant); }
    .sheet-option:last-child { border-bottom: none; }
    .sheet-option-label { font-size: var(--font-size-body-base); color: var(--on-surface); }
    .sheet-option-value { font-size: var(--font-size-body-sm); color: var(--on-surface-variant); }
    .sheet-option svg { width: 20px; height: 20px; color: var(--neutral-400); }
  </style>
</head>
<body><div class="preview-container">

  <!-- Bottom Sheet Example -->
  <div class="section">
    <div class="section-title">Bottom Sheet</div>
    <div class="sheet-demo">
      <div class="scrim">
        <div class="bottom-sheet">
          <div class="drag-handle-area">
            <div class="drag-handle"></div>
          </div>
          <div class="sheet-title">设置</div>
          <div class="sheet-body">
            <div class="sheet-option">
              <span class="sheet-option-label">学习提醒</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="sheet-option">
              <span class="sheet-option-label">深色模式</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="sheet-option">
              <span class="sheet-option-label">导出数据</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="sheet-option">
              <span class="sheet-option-label">清除缓存</span>
              <span class="sheet-option-value">23.5 MB</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div></body>
</html>
